<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templeton Academy — Campus Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TEMPLETON ACADEMY BRAND COLORS (from Brand Guide v001)
     ============================================================ */
  :root {
    /* Primary palette */
    --t-pink:    #f5b6e9;
    --t-cyan:    #78e1e8;
    --t-red:     #f55657;
    --t-blue:    #455be2;
    --t-yellow:  #ffbb22;
    --t-green:   #018e75;
    --t-peach:   #edaf84;
    --t-purple:  #822f91;
    --t-blush:   #eadbde;
    --t-dark:    #262626;

    /* Secondary palette */
    --t-deep-purple: #574675;
    --t-wine:        #7a0e5b;
    --t-magenta:     #db3198;
    --t-sage:        #b2d28a;
    --t-lime:        #c9f414;

    /* Functional */
    --bg:        #262626;
    --text:      #ffffff;
    --text-muted: #9a9a9a;
    --success:   #4ADE80;
    --warning:   #FBBF24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ============================================================
     HEADER — Logo (left) + Weather (right)
     ============================================================ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 2.5rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .logo-mark {
    height: 80px;
    width: auto;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  .brand-text .academy {
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text);
    margin-top: 0.1rem;
  }

  /* Weather area — right side of header */
  .weather-area {
    text-align: right;
  }

  .weather-top {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: flex-end;
  }

  .weather-icon {
    font-size: 3.5rem;
    line-height: 1;
  }

  .weather-temp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1;
  }

  .weather-condition {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 2px;
    text-align: right;
  }

  .weather-stats {
    display: flex;
    gap: 1.8rem;
    margin-top: 0.6rem;
    justify-content: flex-end;
  }

  .weather-stat label {
    display: block;
    font-size: 0.55rem;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .weather-stat span {
    font-weight: 700;
    font-size: 0.85rem;
  }

  /* ============================================================
     MAIN GRID — Calendar (left) + Trains (right)
     ============================================================ */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    padding: 0 2.5rem 2rem;
    min-height: 0;
  }

  /* ============================================================
     PANEL BASE
     ============================================================ */
  .panel {
    border-radius: 20px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============================================================
     CALENDAR PANEL (left, green)
     ============================================================ */
  .calendar-panel {
    background: linear-gradient(150deg, #01a88d 0%, var(--t-green) 40%, #015c4e 100%);
  }

  .calendar-date {
    font-family: 'DM Serif Display', serif;
    font-size: 1.7rem;
    font-weight: 400;
    margin-bottom: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }

  .event-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    overflow-y: auto;
  }

  .event-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0.5rem;
    border-radius: 10px;
    transition: background 0.2s;
  }

  .event-row.current {
    background: rgba(255, 255, 255, 0.1);
  }

  .event-row.past {
    opacity: 0.4;
  }

  .event-bar {
    width: 4px;
    height: 34px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.5);
    flex-shrink: 0;
  }

  .event-row.current .event-bar {
    background: var(--t-yellow);
    box-shadow: 0 0 8px rgba(255, 187, 34, 0.4);
  }

  .event-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 600;
    min-width: 70px;
    flex-shrink: 0;
  }

  .event-row.current .event-time {
    color: var(--t-yellow);
  }

  .event-info {
    flex: 1;
    min-width: 0;
  }

  .event-title {
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-row.past .event-title {
    text-decoration: line-through;
  }

  .event-location {
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 1px;
  }

  .now-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.5rem;
    color: var(--t-yellow);
    background: rgba(255, 187, 34, 0.15);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ============================================================
     TRAIN PANEL (right, purple)
     ============================================================ */
  .train-panel {
    background: linear-gradient(150deg, #9b37ad 0%, var(--t-purple) 40%, var(--t-deep-purple) 100%);
  }

  .train-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.85rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }

  .station-name {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .live-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--success);
    background: rgba(74, 222, 128, 0.12);
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid rgba(74, 222, 128, 0.3);
    font-weight: 700;
    animation: livePulse 2s ease-in-out infinite;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .train-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
  }

  .train-row {
    display: grid;
    grid-template-columns: 5px 56px 1fr auto;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.5rem;
    border-radius: 10px;
    transition: background 0.2s;
  }

  .train-row:nth-child(odd) {
    background: rgba(255, 255, 255, 0.05);
  }

  .train-line-bar {
    width: 5px;
    height: 28px;
    border-radius: 3px;
  }

  .train-line-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    text-align: center;
    padding: 0.2rem 0;
    border-radius: 5px;
    letter-spacing: 0.05em;
  }

  .train-dest {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .train-car {
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.5);
  }

  .train-eta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    text-align: right;
    min-width: 55px;
  }

  .train-eta .unit {
    font-size: 0.55rem;
    color: rgba(255, 255, 255, 0.5);
    margin-left: 1px;
  }

  .train-eta.arriving {
    color: var(--success);
    font-size: 0.85rem;
    animation: arrPulse 1.5s ease-in-out infinite;
  }

  .train-eta.near {
    color: var(--warning);
  }

  @keyframes arrPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .train-loading, .train-error {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.85rem;
  }

  /* ============================================================
     UTILITIES
     ============================================================ */
  /* WMATA line colors */
  .line-RD { --lc: #E51636; }
  .line-OR { --lc: #F68712; }
  .line-BL { --lc: #0795D3; }
  .line-GR { --lc: #00B140; }
  .line-YL { --lc: #FFD520; }
  .line-SV { --lc: #A2A4A1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>
<body>

<!-- ============================================================
     HEADER — Logo + Weather
     ============================================================ -->
<header class="header">
  <div class="brand">
    <!-- Templeton Academy question mark logo (yellow on dark bg) -->
    <svg class="logo-mark" viewBox="0 0 80 130" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 46 C24 16, 56 16, 56 40 C56 58, 40 60, 40 78 L40 88"
            stroke="#ffbb22" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="40" cy="110" r="8" fill="#ffbb22"/>
    </svg>
    <div class="brand-text">
      <h1>Templeton</h1>
      <div class="academy">Academy</div>
    </div>
  </div>

  <div class="weather-area">
    <div class="weather-top">
      <div class="weather-icon" id="weatherIcon">--</div>
      <div>
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-condition" id="weatherCond">Loading…</div>
      </div>
    </div>
    <div class="weather-stats">
      <div class="weather-stat"><label>High</label><span id="weatherHi">--°</span></div>
      <div class="weather-stat"><label>Low</label><span id="weatherLo">--°</span></div>
      <div class="weather-stat"><label>Humidity</label><span id="weatherHum">--%</span></div>
      <div class="weather-stat"><label>Wind</label><span id="weatherWind">-- mph</span></div>
    </div>
  </div>
</header>

<!-- ============================================================
     MAIN CONTENT — Calendar (left) + Metro (right)
     ============================================================ -->
<main class="main">
  <!-- LEFT: CALENDAR / EVENTS -->
  <div class="panel calendar-panel">
    <div class="calendar-date" id="calendarDate">Loading…</div>
    <div class="event-list" id="eventList">
      <!-- Events will be rendered here -->
    </div>
  </div>

  <!-- RIGHT: WMATA TRAINS -->
  <div class="panel train-panel">
    <div class="train-header">
      <div class="station-name">Gallery Place / Chinatown</div>
      <div class="live-badge" id="liveBadge">LIVE</div>
    </div>
    <div class="train-list" id="trainList">
      <div class="train-loading">Loading train predictions…</div>
    </div>
  </div>
</main>

<script>
// ================================================================
// CONFIGURATION
// ================================================================
const CONFIG = {
  schoolName: "Templeton Academy",
  // WMATA
  wmataKey: "cfba80d9e11345c0936871c360191696",
  // Gallery Place-Chinatown: F01 (Green/Yellow), B01 (Red)
  wmataStations: "F01,B01",
  wmataRefreshMs: 20000, // 20 seconds

  // Weather — Open-Meteo (free, no key)
  // Coordinates for Gallery Place-Chinatown area, Washington DC
  weatherLat: 38.8983,
  weatherLon: -77.0219,
  weatherRefreshMs: 600000, // 10 minutes

  // Google Calendar — see README for setup instructions
  // Set your Google Calendar API key and calendar ID below
  gcalApiKey: "",       // YOUR_GOOGLE_CALENDAR_API_KEY
  gcalCalendarId: "c_1a16eeb0cec7d70c595f8bcb63667419243c8c58965a4d6ea2906270bf6d914f@group.calendar.google.com",
  gcalRefreshMs: 300000, // 5 minutes
};

// ================================================================
// WMATA LINE CONFIG
// ================================================================
const WMATA_LINES = {
  RD: { name: "Red",    color: "#E51636" },
  OR: { name: "Orange", color: "#F68712" },
  BL: { name: "Blue",   color: "#0795D3" },
  GR: { name: "Green",  color: "#00B140" },
  YL: { name: "Yellow", color: "#FFD520" },
  SV: { name: "Silver", color: "#A2A4A1" },
};

// WMO weather code → emoji + description
const WMO_CODES = {
  0: ["☀️", "Clear Sky"],
  1: ["🌤️", "Mostly Clear"],
  2: ["⛅", "Partly Cloudy"],
  3: ["☁️", "Overcast"],
  45: ["🌫️", "Foggy"],
  48: ["🌫️", "Rime Fog"],
  51: ["🌦️", "Light Drizzle"],
  53: ["🌦️", "Drizzle"],
  55: ["🌧️", "Heavy Drizzle"],
  61: ["🌧️", "Light Rain"],
  63: ["🌧️", "Rain"],
  65: ["🌧️", "Heavy Rain"],
  66: ["🌨️", "Freezing Rain"],
  67: ["🌨️", "Heavy Freezing Rain"],
  71: ["❄️", "Light Snow"],
  73: ["❄️", "Snow"],
  75: ["❄️", "Heavy Snow"],
  77: ["🌨️", "Snow Grains"],
  80: ["🌦️", "Light Showers"],
  81: ["🌧️", "Showers"],
  82: ["⛈️", "Heavy Showers"],
  85: ["🌨️", "Snow Showers"],
  86: ["🌨️", "Heavy Snow Showers"],
  95: ["⛈️", "Thunderstorm"],
  96: ["⛈️", "Thunderstorm w/ Hail"],
  99: ["⛈️", "Severe Thunderstorm"],
};

// ================================================================
// CALENDAR DATE HEADER
// ================================================================
function updateCalendarDate() {
  const now = new Date();
  const day = now.getDate();
  const suffix = (day === 1 || day === 21 || day === 31) ? "st"
               : (day === 2 || day === 22) ? "nd"
               : (day === 3 || day === 23) ? "rd" : "th";
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  const month = now.toLocaleDateString("en-US", { month: "long" });

  document.getElementById("calendarDate").textContent =
    `${weekday}, ${month} ${day}${suffix}, ${now.getFullYear()}`;
}
updateCalendarDate();
setInterval(updateCalendarDate, 60000);

// ================================================================
// WMATA TRAINS
// ================================================================
async function fetchTrains() {
  try {
    const url = `https://api.wmata.com/StationPrediction.svc/json/GetPrediction/${CONFIG.wmataStations}`;
    const res = await fetch(url, {
      headers: { "api_key": CONFIG.wmataKey }
    });
    if (!res.ok) throw new Error(`WMATA ${res.status}`);
    const data = await res.json();
    renderTrains(data.Trains || []);
    document.getElementById("liveBadge").textContent = "LIVE";
    document.getElementById("liveBadge").style.color = "";
  } catch (err) {
    console.error("WMATA error:", err);
    document.getElementById("liveBadge").textContent = "ERROR";
    document.getElementById("liveBadge").style.color = "#f55657";
  }
}

function renderTrains(trains) {
  const list = document.getElementById("trainList");

  // Filter out trains with no useful info
  const filtered = trains.filter(t =>
    t.Line && t.Line !== "--" && t.Line !== "No" &&
    t.DestinationName && t.DestinationName !== "No Passenger" &&
    t.DestinationName !== "Train"
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="train-loading">No trains currently predicted</div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const line = WMATA_LINES[t.Line] || { name: t.Line, color: "#666" };
    const isArr = t.Min === "ARR" || t.Min === "BRD";
    const isNear = !isArr && !isNaN(t.Min) && parseInt(t.Min) <= 3;
    const etaClass = isArr ? "arriving" : isNear ? "near" : "";

    return `
      <div class="train-row">
        <div class="train-line-bar" style="background:${line.color}; box-shadow:0 0 6px ${line.color}55;"></div>
        <div class="train-line-badge" style="background:${line.color}22; border:1.5px solid ${line.color}88; color:${line.color};">
          ${line.name}
        </div>
        <div>
          <div class="train-dest">${t.DestinationName}</div>
          <div class="train-car">${t.Car || "–"}-car train</div>
        </div>
        <div class="train-eta ${etaClass}">
          ${isArr
            ? (t.Min === "ARR" ? "ARRIVING" : "BOARDING")
            : `${t.Min}<span class="unit">min</span>`
          }
        </div>
      </div>`;
  }).join("");
}

fetchTrains();
setInterval(fetchTrains, CONFIG.wmataRefreshMs);

// ================================================================
// WEATHER (Open-Meteo — free, no API key needed)
// ================================================================
async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.weatherLat}&longitude=${CONFIG.weatherLon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Weather ${res.status}`);
    const data = await res.json();

    const current = data.current;
    const daily = data.daily;
    const code = current.weather_code;
    const [icon, desc] = WMO_CODES[code] || ["🌡️", "Unknown"];

    document.getElementById("weatherIcon").textContent = icon;
    document.getElementById("weatherTemp").textContent = `${Math.round(current.temperature_2m)}°`;
    document.getElementById("weatherCond").textContent = desc;
    document.getElementById("weatherHi").textContent = `${Math.round(daily.temperature_2m_max[0])}°`;
    document.getElementById("weatherLo").textContent = `${Math.round(daily.temperature_2m_min[0])}°`;
    document.getElementById("weatherHum").textContent = `${current.relative_humidity_2m}%`;
    document.getElementById("weatherWind").textContent = `${Math.round(current.wind_speed_10m)} mph`;
  } catch (err) {
    console.error("Weather error:", err);
    document.getElementById("weatherCond").textContent = "Unable to load";
  }
}

fetchWeather();
setInterval(fetchWeather, CONFIG.weatherRefreshMs);

// ================================================================
// GOOGLE CALENDAR (with fallback demo data)
// ================================================================
const DEMO_EVENTS = [
  { title: "Morning Assembly", time: "8:00 AM", location: "Main Hall" },
  { title: "Advisory — Find Your Why", time: "9:00 AM", location: "Classrooms" },
  { title: "Faculty Meeting", time: "10:30 AM", location: "Room 204" },
  { title: "Parent-Teacher Conference", time: "1:00 PM", location: "Library" },
  { title: "Basketball Practice", time: "3:30 PM", location: "Gymnasium" },
  { title: "Board Meeting", time: "5:00 PM", location: "Admin Office" },
];

async function fetchCalendarEvents() {
  if (!CONFIG.gcalApiKey || !CONFIG.gcalCalendarId) {
    renderEvents(DEMO_EVENTS);
    return;
  }

  try {
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).toISOString();

    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CONFIG.gcalCalendarId)}/events?key=${CONFIG.gcalApiKey}&timeMin=${startOfDay}&timeMax=${endOfDay}&singleEvents=true&orderBy=startTime`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GCal ${res.status}`);
    const data = await res.json();

    const events = (data.items || []).map(item => {
      const start = item.start.dateTime ? new Date(item.start.dateTime) : null;
      return {
        title: item.summary || "Untitled",
        time: start ? start.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "All Day",
        location: item.location || "",
        startDate: start,
      };
    });

    renderEvents(events.length > 0 ? events : DEMO_EVENTS);
  } catch (err) {
    console.error("Calendar error:", err);
    renderEvents(DEMO_EVENTS);
  }
}

function renderEvents(events) {
  const list = document.getElementById("eventList");
  const now = new Date();
  const currentHour = now.getHours();
  const currentMin = now.getMinutes();

  list.innerHTML = events.map(ev => {
    // Parse time for current/past detection
    let isPast = false, isCurrent = false;
    const match = ev.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if (match) {
      let h = parseInt(match[1]);
      const m = parseInt(match[2]);
      const ap = match[3].toUpperCase();
      if (ap === "PM" && h !== 12) h += 12;
      if (ap === "AM" && h === 12) h = 0;
      isPast = currentHour > h || (currentHour === h && currentMin > m + 55);
      isCurrent = currentHour === h && currentMin >= m && currentMin < m + 55;
    }

    const cls = isCurrent ? "current" : isPast ? "past" : "";

    return `
      <div class="event-row ${cls}">
        <div class="event-bar"></div>
        <div class="event-time">${ev.time}</div>
        <div class="event-info">
          <div class="event-title">${ev.title}</div>
          ${ev.location ? `<div class="event-location">📍 ${ev.location}</div>` : ""}
        </div>
        ${isCurrent ? '<div class="now-badge">NOW</div>' : ""}
      </div>`;
  }).join("");
}

fetchCalendarEvents();
setInterval(fetchCalendarEvents, CONFIG.gcalRefreshMs);
</script>

</body>
</html>
