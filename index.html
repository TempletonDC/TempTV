<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templeton Academy — Campus Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TEMPLETON ACADEMY BRAND COLORS (from Brand Guide v001)
     ============================================================ */
  :root {
    /* Primary palette */
    --t-pink:    #f5b6e9;
    --t-cyan:    #78e1e8;
    --t-red:     #f55657;
    --t-blue:    #455be2;
    --t-yellow:  #ffbb22;
    --t-green:   #018e75;
    --t-peach:   #edaf84;
    --t-purple:  #822f91;
    --t-blush:   #eadbde;
    --t-dark:    #262626;

    /* Secondary palette */
    --t-deep-purple: #574675;
    --t-wine:        #7a0e5b;
    --t-magenta:     #db3198;
    --t-sage:        #b2d28a;
    --t-lime:        #c9f414;

    /* Functional */
    --bg:        #262626;
    --text:      #ffffff;
    --text-muted: #9a9a9a;
    --success:   #4ADE80;
    --warning:   #FBBF24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ============================================================
     HEADER — Logo (left) + Clock (center) + Weather (right)
     ============================================================ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.8rem 3rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex: 1;
  }

  .logo-mark {
    height: 100px;
    width: auto;
    flex-shrink: 0;
  }

  /* Clock — center of header */
  .clock-area {
    flex: 1;
    text-align: center;
  }

  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 5rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  .clock-period {
    font-size: 1.8rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
    margin-left: 0.3rem;
  }

  .clock-date {
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.45);
    margin-top: 0.2rem;
    font-weight: 500;
  }

  /* Weather area — right side of header */
  .weather-area {
    text-align: right;
    flex: 1;
  }

  .weather-top {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: flex-end;
  }

  .weather-icon {
    font-size: 4.2rem;
    line-height: 1;
    width: 5.5rem;
    height: 5.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
    overflow: hidden;
  }

  .weather-temp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 4rem;
    font-weight: 700;
    line-height: 1;
  }

  .weather-condition {
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 4px;
    text-align: right;
  }

  .weather-stats {
    display: flex;
    gap: 2rem;
    margin-top: 0.6rem;
    justify-content: flex-end;
  }

  .weather-stat label {
    display: block;
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .weather-stat span {
    font-weight: 700;
    font-size: 1.1rem;
  }

  /* ============================================================
     MAIN GRID — Calendar (left) + Trains (right)
     ============================================================ */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    padding: 0 3rem 2rem;
    min-height: 0;
  }

  /* ============================================================
     PANEL BASE
     ============================================================ */
  .panel {
    border-radius: 24px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============================================================
     CALENDAR PANEL (left, green — flat)
     ============================================================ */
  .calendar-panel {
    background: var(--t-green);
  }

  .calendar-date {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    margin-bottom: 1.2rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
  }

  .event-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    overflow-y: auto;
  }

  .event-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 0.75rem;
    border-radius: 14px;
    transition: background 0.2s;
  }

  .event-row.current {
    background: rgba(255, 255, 255, 0.12);
  }

  .event-row.past {
    opacity: 0.35;
  }

  .event-bar {
    width: 5px;
    height: 42px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.5);
    flex-shrink: 0;
  }

  .event-row.current .event-bar {
    background: var(--t-yellow);
  }

  .event-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.05rem;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 600;
    min-width: 100px;
    flex-shrink: 0;
  }

  .event-row.current .event-time {
    color: var(--t-yellow);
  }

  .event-info {
    flex: 1;
    min-width: 0;
  }

  .event-title {
    font-weight: 600;
    font-size: 1.35rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-row.past .event-title {
    text-decoration: line-through;
  }

  .event-location {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 2px;
  }

  .now-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--t-yellow);
    background: rgba(255, 187, 34, 0.18);
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ============================================================
     TRAIN PANEL (right, purple — flat)
     ============================================================ */
  .train-panel {
    background: var(--t-purple);
  }

  .train-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
  }

  .station-name {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
  }

  .live-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--success);
    background: rgba(74, 222, 128, 0.12);
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid rgba(74, 222, 128, 0.3);
    font-weight: 700;
    animation: livePulse 2s ease-in-out infinite;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .train-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }

  .train-row {
    display: grid;
    grid-template-columns: 6px 80px 1fr auto;
    align-items: center;
    gap: 0.8rem;
    padding: 0.65rem 0.75rem;
    border-radius: 14px;
    transition: background 0.2s;
  }

  .train-row:nth-child(odd) {
    background: rgba(255, 255, 255, 0.06);
  }

  .train-line-bar {
    width: 6px;
    height: 36px;
    border-radius: 3px;
  }

  .train-line-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    text-align: center;
    padding: 0.3rem 0;
    border-radius: 6px;
    letter-spacing: 0.05em;
  }

  .train-dest {
    font-weight: 600;
    font-size: 1.3rem;
  }

  .train-car {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.5);
  }

  .train-eta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    text-align: right;
    min-width: 70px;
  }

  .train-eta .unit {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.5);
    margin-left: 2px;
  }

  .train-eta.arriving {
    color: var(--success);
    font-size: 1.2rem;
    animation: arrPulse 1.5s ease-in-out infinite;
  }

  .train-eta.near {
    color: var(--warning);
  }

  @keyframes arrPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .train-loading, .train-error {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 1.2rem;
  }

  /* ============================================================
     UTILITIES
     ============================================================ */
  /* WMATA line colors */
  .line-RD { --lc: #f55657; }
  .line-OR { --lc: #F68712; }
  .line-BL { --lc: #0795D3; }
  .line-GR { --lc: #018e75; }
  .line-YL { --lc: #ffbb22; }
  .line-SV { --lc: #A2A4A1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  /* Google sign-in button */
  .gcal-signin {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 1rem;
  }

  .gcal-signin button {
    font-family: 'Outfit', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    cursor: pointer;
  }

  .gcal-signin button:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  .gcal-signin p {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.5);
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>

<!-- ============================================================
     HEADER — Logo + Clock + Weather
     ============================================================ -->
<header class="header">
  <div class="brand">
    <img class="logo-mark" src="Templeton_fulllogo_rgb_trans_yellow_inverse.png" alt="Templeton Academy">
  </div>

  <div class="clock-area">
    <div class="clock-time" id="clockTime">--:--<span class="clock-period">--</span></div>
    <div class="clock-date" id="clockDate"></div>
  </div>

  <div class="weather-area">
    <div class="weather-top">
      <div class="weather-icon" id="weatherIcon">--</div>
      <div>
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-condition" id="weatherCond">Loading…</div>
      </div>
    </div>
    <div class="weather-stats">
      <div class="weather-stat"><label>High</label><span id="weatherHi">--°</span></div>
      <div class="weather-stat"><label>Low</label><span id="weatherLo">--°</span></div>
      <div class="weather-stat"><label>Humidity</label><span id="weatherHum">--%</span></div>
      <div class="weather-stat"><label>Wind</label><span id="weatherWind">-- mph</span></div>
    </div>
  </div>
</header>

<!-- ============================================================
     MAIN CONTENT — Calendar (left) + Metro (right)
     ============================================================ -->
<main class="main">
  <!-- LEFT: CALENDAR / EVENTS -->
  <div class="panel calendar-panel">
    <div class="calendar-date" id="calendarDate">Loading…</div>
    <div class="event-list" id="eventList">
      <!-- Events will be rendered here -->
    </div>
  </div>

  <!-- RIGHT: WMATA TRAINS -->
  <div class="panel train-panel">
    <div class="train-header">
      <div class="station-name">Gallery Place / Chinatown</div>
      <div class="live-badge" id="liveBadge">LIVE</div>
    </div>
    <div class="train-list" id="trainList">
      <div class="train-loading">Loading train predictions…</div>
    </div>
  </div>
</main>

<script>
// ================================================================
// CONFIGURATION
// ================================================================
const CONFIG = {
  schoolName: "Templeton Academy",
  // WMATA
  wmataKey: "cfba80d9e11345c0936871c360191696",
  // Gallery Place-Chinatown: F01 (Green/Yellow), B01 (Red)
  wmataStations: "F01,B01",
  wmataRefreshMs: 20000, // 20 seconds

  // Weather — Open-Meteo (free, no key)
  // Coordinates for Gallery Place-Chinatown area, Washington DC
  weatherLat: 38.8983,
  weatherLon: -77.0219,
  weatherRefreshMs: 600000, // 10 minutes

  // Google Calendar — see README for setup instructions
  // Set your Google Calendar API key and calendar ID below
  gcalApiKey: "",       // YOUR_GOOGLE_CALENDAR_API_KEY
  gcalClientId: "744336672410-4k1n70cihclafmv3n3avilutkpgae4ga.apps.googleusercontent.com",
  gcalCalendarId: "c_1a16eeb0cec7d70c595f8bcb63667419243c8c58965a4d6ea2906270bf6d914f@group.calendar.google.com",
  gcalRefreshMs: 300000, // 5 minutes
};

// ================================================================
// WMATA LINE CONFIG
// ================================================================
const WMATA_LINES = {
  RD: { name: "Red",    color: "#f55657" },
  OR: { name: "Orange", color: "#F68712" },
  BL: { name: "Blue",   color: "#0795D3" },
  GR: { name: "Green",  color: "#018e75" },
  YL: { name: "Yellow", color: "#ffbb22" },
  SV: { name: "Silver", color: "#A2A4A1" },
};

// WMO weather code → emoji + description
const WMO_CODES = {
  0: ["☀️", "Clear Sky"],
  1: ["🌤️", "Mostly Clear"],
  2: ["⛅", "Partly Cloudy"],
  3: ["☁️", "Overcast"],
  45: ["🌫️", "Foggy"],
  48: ["🌫️", "Rime Fog"],
  51: ["🌦️", "Light Drizzle"],
  53: ["🌦️", "Drizzle"],
  55: ["🌧️", "Heavy Drizzle"],
  61: ["🌧️", "Light Rain"],
  63: ["🌧️", "Rain"],
  65: ["🌧️", "Heavy Rain"],
  66: ["🌨️", "Freezing Rain"],
  67: ["🌨️", "Heavy Freezing Rain"],
  71: ["❄️", "Light Snow"],
  73: ["❄️", "Snow"],
  75: ["❄️", "Heavy Snow"],
  77: ["🌨️", "Snow Grains"],
  80: ["🌦️", "Light Showers"],
  81: ["🌧️", "Showers"],
  82: ["⛈️", "Heavy Showers"],
  85: ["🌨️", "Snow Showers"],
  86: ["🌨️", "Heavy Snow Showers"],
  95: ["⛈️", "Thunderstorm"],
  96: ["⛈️", "Thunderstorm w/ Hail"],
  99: ["⛈️", "Severe Thunderstorm"],
};

// ================================================================
// CLOCK
// ================================================================
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, "0");
  const period = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  document.getElementById("clockTime").innerHTML =
    `${h}:${m}<span class="clock-period">${period}</span>`;

  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  const month = now.toLocaleDateString("en-US", { month: "long" });
  const day = now.getDate();
  const suffix = (day === 1 || day === 21 || day === 31) ? "st"
               : (day === 2 || day === 22) ? "nd"
               : (day === 3 || day === 23) ? "rd" : "th";
  document.getElementById("clockDate").textContent =
    `${weekday}, ${month} ${day}${suffix}`;
}
updateClock();
setInterval(updateClock, 1000);

// ================================================================
// CALENDAR DATE HEADER
// ================================================================
function updateCalendarDate() {
  const now = new Date();
  const day = now.getDate();
  const suffix = (day === 1 || day === 21 || day === 31) ? "st"
               : (day === 2 || day === 22) ? "nd"
               : (day === 3 || day === 23) ? "rd" : "th";
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  const month = now.toLocaleDateString("en-US", { month: "long" });

  document.getElementById("calendarDate").textContent =
    `${weekday}, ${month} ${day}${suffix}, ${now.getFullYear()}`;
}
updateCalendarDate();
setInterval(updateCalendarDate, 60000);

// ================================================================
// WMATA TRAINS
// ================================================================
async function fetchTrains() {
  try {
    const url = `https://api.wmata.com/StationPrediction.svc/json/GetPrediction/${CONFIG.wmataStations}`;
    const res = await fetch(url, {
      headers: { "api_key": CONFIG.wmataKey }
    });
    if (!res.ok) throw new Error(`WMATA ${res.status}`);
    const data = await res.json();
    renderTrains(data.Trains || []);
    document.getElementById("liveBadge").textContent = "LIVE";
    document.getElementById("liveBadge").style.color = "";
  } catch (err) {
    console.error("WMATA error:", err);
    document.getElementById("liveBadge").textContent = "ERROR";
    document.getElementById("liveBadge").style.color = "#f55657";
  }
}

function renderTrains(trains) {
  const list = document.getElementById("trainList");

  // Filter out trains with no useful info and those under 3 minutes (can't make them)
  const filtered = trains.filter(t =>
    t.Line && t.Line !== "--" && t.Line !== "No" &&
    t.DestinationName && t.DestinationName !== "No Passenger" &&
    t.DestinationName !== "Train" &&
    t.Min !== "ARR" && t.Min !== "BRD" &&
    !((!isNaN(t.Min)) && parseInt(t.Min) < 3)
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="train-loading">No trains currently predicted</div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const line = WMATA_LINES[t.Line] || { name: t.Line, color: "#666" };
    const mins = parseInt(t.Min);
    const isNear = !isNaN(mins) && mins <= 5;
    const etaClass = isNear ? "near" : "";

    return `
      <div class="train-row">
        <div class="train-line-bar" style="background:${line.color};"></div>
        <div class="train-line-badge" style="background:${line.color}22; border:1.5px solid ${line.color}88; color:${line.color};">
          ${line.name}
        </div>
        <div>
          <div class="train-dest">${t.DestinationName}</div>
          <div class="train-car">${t.Car || "–"}-car train</div>
        </div>
        <div class="train-eta ${etaClass}">
          ${t.Min}<span class="unit">min</span>
        </div>
      </div>`;
  }).join("");
}

fetchTrains();
setInterval(fetchTrains, CONFIG.wmataRefreshMs);

// ================================================================
// WEATHER (Open-Meteo — free, no API key needed)
// ================================================================
async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.weatherLat}&longitude=${CONFIG.weatherLon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Weather ${res.status}`);
    const data = await res.json();

    const current = data.current;
    const daily = data.daily;
    const code = current.weather_code;
    const [icon, desc] = WMO_CODES[code] || ["🌡️", "Unknown"];

    document.getElementById("weatherIcon").textContent = icon;
    document.getElementById("weatherTemp").textContent = `${Math.round(current.temperature_2m)}°`;
    document.getElementById("weatherCond").textContent = desc;
    document.getElementById("weatherHi").textContent = `${Math.round(daily.temperature_2m_max[0])}°`;
    document.getElementById("weatherLo").textContent = `${Math.round(daily.temperature_2m_min[0])}°`;
    document.getElementById("weatherHum").textContent = `${current.relative_humidity_2m}%`;
    document.getElementById("weatherWind").textContent = `${Math.round(current.wind_speed_10m)} mph`;
  } catch (err) {
    console.error("Weather error:", err);
    document.getElementById("weatherCond").textContent = "Unable to load";
  }
}

fetchWeather();
setInterval(fetchWeather, CONFIG.weatherRefreshMs);

// ================================================================
// GOOGLE CALENDAR — OAuth via Google Identity Services
// ================================================================
const SCOPES = "https://www.googleapis.com/auth/calendar.events.readonly";
const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";

let tokenClient;
let gapiInited = false;
let gisInited = false;
let gcalAccessToken = localStorage.getItem("gcal_access_token") || null;

const DEMO_EVENTS = [
  { title: "Morning Assembly", time: "8:00 AM", location: "Main Hall" },
  { title: "Advisory — Find Your Why", time: "9:00 AM", location: "Classrooms" },
  { title: "Faculty Meeting", time: "10:30 AM", location: "Room 204" },
  { title: "Parent-Teacher Conference", time: "1:00 PM", location: "Library" },
  { title: "Basketball Practice", time: "3:30 PM", location: "Gymnasium" },
  { title: "Board Meeting", time: "5:00 PM", location: "Admin Office" },
];

// Called when gapi.js loads
function gapiLoaded() {
  gapi.load("client", async () => {
    await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
    gapiInited = true;
    maybeStartCalendar();
  });
}

// Called when GIS library loads
function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.gcalClientId,
    scope: SCOPES,
    callback: (tokenResponse) => {
      if (tokenResponse.error) {
        console.error("GIS token error:", tokenResponse);
        showSignInButton();
        return;
      }
      gcalAccessToken = tokenResponse.access_token;
      localStorage.setItem("gcal_access_token", gcalAccessToken);
      // Schedule token refresh before expiry (default ~3600s)
      const expiresIn = (tokenResponse.expires_in || 3600) - 300;
      setTimeout(() => { requestToken(true); }, expiresIn * 1000);
      fetchCalendarEvents();
    },
  });
  gisInited = true;
  maybeStartCalendar();
}

function maybeStartCalendar() {
  if (!gapiInited || !gisInited) return;

  if (!CONFIG.gcalClientId) {
    renderEvents(DEMO_EVENTS);
    return;
  }

  // If we have a stored token, try using it
  if (gcalAccessToken) {
    gapi.client.setToken({ access_token: gcalAccessToken });
    fetchCalendarEvents();
  } else {
    showSignInButton();
  }
}

function showSignInButton() {
  const list = document.getElementById("eventList");
  list.innerHTML = `
    <div class="gcal-signin">
      <p>Sign in to see today's events</p>
      <button onclick="requestToken(false)">Sign in with Google</button>
    </div>`;
}

function requestToken(silent) {
  if (silent) {
    tokenClient.requestAccessToken({ prompt: "" });
  } else {
    tokenClient.requestAccessToken({ prompt: "consent" });
  }
}

async function fetchCalendarEvents() {
  try {
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).toISOString();

    const response = await gapi.client.calendar.events.list({
      calendarId: CONFIG.gcalCalendarId,
      timeMin: startOfDay,
      timeMax: endOfDay,
      singleEvents: true,
      orderBy: "startTime",
    });

    const items = response.result.items || [];
    const events = items.map(item => {
      const start = item.start.dateTime ? new Date(item.start.dateTime) : null;
      return {
        title: item.summary || "Untitled",
        time: start ? start.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "All Day",
        location: item.location || "",
        startDate: start,
      };
    });

    renderEvents(events.length > 0 ? events : DEMO_EVENTS);
  } catch (err) {
    console.error("Calendar error:", err);
    // Token might be expired — clear and show sign-in
    if (err.status === 401 || err.status === 403) {
      gcalAccessToken = null;
      localStorage.removeItem("gcal_access_token");
      gapi.client.setToken(null);
      // Try silent re-auth first
      try { requestToken(true); } catch { showSignInButton(); }
    } else {
      renderEvents(DEMO_EVENTS);
    }
  }
}

function renderEvents(events) {
  const list = document.getElementById("eventList");
  const now = new Date();
  const currentHour = now.getHours();
  const currentMin = now.getMinutes();

  list.innerHTML = events.map(ev => {
    // Parse time for current/past detection
    let isPast = false, isCurrent = false;
    const match = ev.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if (match) {
      let h = parseInt(match[1]);
      const m = parseInt(match[2]);
      const ap = match[3].toUpperCase();
      if (ap === "PM" && h !== 12) h += 12;
      if (ap === "AM" && h === 12) h = 0;
      isPast = currentHour > h || (currentHour === h && currentMin > m + 55);
      isCurrent = currentHour === h && currentMin >= m && currentMin < m + 55;
    }

    const cls = isCurrent ? "current" : isPast ? "past" : "";

    return `
      <div class="event-row ${cls}">
        <div class="event-bar"></div>
        <div class="event-time">${ev.time}</div>
        <div class="event-info">
          <div class="event-title">${ev.title}</div>
          ${ev.location ? `<div class="event-location">${ev.location}</div>` : ""}
        </div>
        ${isCurrent ? '<div class="now-badge">NOW</div>' : ""}
      </div>`;
  }).join("");
}

// Refresh calendar on interval
setInterval(() => {
  if (gcalAccessToken) fetchCalendarEvents();
}, CONFIG.gcalRefreshMs);

// Wait for external scripts to load, then init
function waitForLibs() {
  if (typeof gapi !== "undefined") gapiLoaded();
  else setTimeout(() => { if (typeof gapi !== "undefined") gapiLoaded(); }, 500);

  if (typeof google !== "undefined" && google.accounts) gisLoaded();
  else setTimeout(() => { if (typeof google !== "undefined" && google.accounts) gisLoaded(); }, 500);
}
// Retry a few times in case scripts are slow to load
let libRetries = 0;
function initLibsWithRetry() {
  const gapiReady = typeof gapi !== "undefined";
  const gisReady = typeof google !== "undefined" && google.accounts;
  if (gapiReady && !gapiInited) gapiLoaded();
  if (gisReady && !gisInited) gisLoaded();
  if ((!gapiReady || !gisReady) && libRetries < 20) {
    libRetries++;
    setTimeout(initLibsWithRetry, 500);
  } else if (libRetries >= 20 && !gapiInited) {
    // Libraries failed to load — show demo data
    console.warn("Google API libraries failed to load, using demo events");
    renderEvents(DEMO_EVENTS);
  }
}
initLibsWithRetry();
</script>
